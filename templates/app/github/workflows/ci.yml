# Every change, in parallel jobs: the checks (`pnpm check`) and the tests (`pnpm test`), together `pnpm gate`, which the
# pre-push hook runs too; the workflows themselves, a secrets scan, and on pull requests the title and, once the
# repository is public, a review of new dependencies. A new push to a pull request cancels the run it replaces; a push
# to main always finishes. codeql.yml and scorecard.yml add code scanning once the repository is public.
name: CI

on:
  pull_request:
    # `edited` too: a changed title is checked again
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before setup-node: its pnpm cache needs pnpm on the PATH
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Types, lint, format, migrations/ and the build, exactly as `pnpm check` runs them locally (`pnpm format` fixes
      # formatting, `pnpm migrations` writes what is missing)
      - run: pnpm check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # workflows, secrets and title call escalay/.github's shared workflows, so each check is named "<job> / <its job>"
  # (workflows / lint, secrets / gitleaks, title / conventional); Dependabot moves the pin.
  # actionlint for mistakes, zizmor for the ways a workflow can be turned against its repository
  workflows:
    uses: escalay/.github/.github/workflows/workflows.yml@b945d51a4e0d15c924874c395e09752109d00d8b # v1.0.0

  # gitleaks over the whole history (a key committed and then removed is still found), with .gitleaks.toml
  secrets:
    uses: escalay/.github/.github/workflows/secrets.yml@b945d51a4e0d15c924874c395e09752109d00d8b # v1.0.0

  # The title is a Conventional Commit: it becomes the commit on main
  title:
    if: github.event_name == 'pull_request'
    uses: escalay/.github/.github/workflows/title.yml@b945d51a4e0d15c924874c395e09752109d00d8b # v1.0.0

  # Dependency review: a pull request that adds a dependency with a known high-severity vulnerability fails. GitHub's
  # free plan has it on public repositories only, so it is skipped while the repository is private
  dependencies:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the summary it leaves on a pull request that adds a vulnerable dependency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
