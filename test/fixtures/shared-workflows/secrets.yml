# Stands in for escalay/.github's secrets.yml in `kit repo` tests: one job that always runs, one that runs only sometimes
on:
  workflow_call:

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - run: echo gitleaks
  report:
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - run: echo report
