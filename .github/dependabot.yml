# Routine updates once a month, one pull request per ecosystem; a major version comes on its own.
# A version is proposed only after a week on the registry, so a hijacked release is usually pulled first.
# Security updates are separate and arrive as soon as an advisory is out.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']
