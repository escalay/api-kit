name: CI

on:
  pull_request:
    # `edited` too: a changed title is checked again
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  # release.yml starts it on the release pull request, which its own token cannot trigger otherwise
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before setup-node: its pnpm cache needs pnpm on the PATH
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Its own job, beside the tests: it scaffolds and installs whole apps, the slowest part of a run
  starter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Starter scaffolds, installs and passes its own CI's checks
        run: pnpm test:starter

  # The title becomes the squash commit, and so a line in the release notes
  title:
    if: github.event_name == 'pull_request'
    uses: escalay/.github/.github/workflows/title.yml@77927b958181cff87d6fd903f7d9c32afc087617 # v1.0.1

  # actionlint and zizmor over this repository's workflows, then the ones every new app starts with
  workflows:
    uses: escalay/.github/.github/workflows/workflows.yml@77927b958181cff87d6fd903f7d9c32afc087617 # v1.0.1
    with:
      also: templates/app/github

  # gitleaks over the whole history, so a key committed and then removed is still found
  secrets:
    uses: escalay/.github/.github/workflows/secrets.yml@77927b958181cff87d6fd903f7d9c32afc087617 # v1.0.1

  # A run started by a dispatch (release.yml does it for the release pull request) reports on the commit, but GitHub does
  # not count those checks for a pull request. Commit statuses do, so once everything passed it sets each check the
  # rules for main require (read from the rules at that moment) as one, and auto-merge can go ahead
  dispatched:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, starter, workflows, secrets]
    permissions:
      statuses: write
    uses: escalay/.github/.github/workflows/required-statuses.yml@77927b958181cff87d6fd903f7d9c32afc087617 # v1.0.1
