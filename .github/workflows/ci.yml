name: CI

on:
  pull_request:
    # `edited` too: a changed title is checked again
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  # release.yml starts it on the release pull request, which its own token cannot trigger otherwise
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before setup-node: its pnpm cache needs pnpm on the PATH
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Starter scaffolds, installs and passes its own tests
        run: pnpm test:starter

  # The title becomes the squash commit, and so a line in the release notes
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The pull request title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs|refactor|chore|test|build|ci|revert)(\([a-z0-9./-]+\))?!?: [^ ].*$'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::The title \"$TITLE\" is not a Conventional Commit. It becomes the commit on main and a line in the release notes, e.g. \"feat: add cursor pages to boards\" or \"fix(mcp): answer a tool call without arguments\"."
            exit 1
          fi

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline .github
